# docker-compose.yml - Complete VizGenie Stack with Streamlit UI

version: '3.8'

services:
  # ==========================================================================
  # DEMO APPLICATION (FastAPI)
  # ==========================================================================
  
  fastapi-app:
    build: ./demo/app
    container_name: fastapi-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:admin@postgres:5432/app_db
      - LOG_LEVEL=INFO
    depends_on:
      - postgres
    networks:
      - monitoring
    labels:
      logging: "promtail"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # LOAD GENERATOR
  # ==========================================================================
  
  load-generator:
    build: ./demo/load-generator
    container_name: load-generator
    restart: unless-stopped
    environment:
      - TARGET_URL=http://fastapi-app:8000
      - REQUESTS_PER_SECOND=10
      - ERROR_SCENARIO=all
    depends_on:
      - fastapi-app
    networks:
      - monitoring

  # vizgenie:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: vizgenie
  #   ports:
  #     - "8501:8501"
  #   environment:
  #     - GROQ_API_KEY=${GROQ_API_KEY}
  #     - LOG_LEVEL=${LOG_LEVEL:-INFO}
  #   volumes:
  #     - ./config:/app/config
  #     - ./metadata:/app/metadata
  #     - ./data:/app/data
  #     - ./logs:/app/logs
  #     - chroma-data:/app/chroma_db
  #   depends_on:
  #     grafana:
  #       condition: service_healthy
  #     prometheus:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_healthy
  #     loki:
  #       condition: service_healthy
  #   networks:
  #     - monitoring
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

  # ==========================================================================
  # INFRASTRUCTURE - DATABASE
  # ==========================================================================
  
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./demo/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==========================================================================
  # INFRASTRUCTURE - METRICS (Prometheus)
  # ==========================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./demo/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # INFRASTRUCTURE - LOGS (Loki)
  # ==========================================================================
  
  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    restart: unless-stopped
    volumes:
      - ./demo/config/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # INFRASTRUCTURE - LOG COLLECTOR (Promtail)
  # ==========================================================================
  
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./demo/config/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    networks:
      - monitoring

  # ==========================================================================
  # INFRASTRUCTURE - VISUALIZATION (Grafana)
  # ==========================================================================
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./demo/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local
  postgres-data:
    driver: local