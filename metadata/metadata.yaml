# VizGenie - PostgreSQL Schema Metadata
# Used by SQL Agent for context-aware query generation
# Update this file to match your actual database schema

postgres:
  tables:

    - table_name: sales_data
      table_desc: "Customer sales transactions"
      columns_metadata:
        ORDERNUMBER:    "integer  - Unique order identifier"
        QUANTITYORDERED: "integer - Number of items ordered"
        PRICEEACH:      "numeric  - Unit price of the item"
        ORDERLINENUMBER: "integer - Line number within the order"
        SALES:          "numeric  - Total sales amount"
        ORDERDATE:      "timestamp - Date the order was placed"
        STATUS:         "varchar  - Order status (Shipped/Cancelled/etc.)"
        QTR_ID:         "integer  - Quarter identifier (1-4)"
        MONTH_ID:       "integer  - Month identifier (1-12)"
        YEAR_ID:        "integer  - Year of the order"
        PRODUCTLINE:    "varchar  - Product category"
        MSRP:           "integer  - Manufacturer suggested retail price"
        PRODUCTCODE:    "varchar  - Unique product identifier"
        CUSTOMERNAME:   "varchar  - Customer full name"
        PHONE:          "varchar  - Customer phone number"
        ADDRESSLINE1:   "varchar  - Primary address"
        ADDRESSLINE2:   "varchar  - Secondary address (nullable)"
        CITY:           "varchar  - Customer city"
        STATE:          "varchar  - Customer state (nullable)"
        POSTALCODE:     "varchar  - Postal / ZIP code (nullable)"
        COUNTRY:        "varchar  - Customer country"
        TERRITORY:      "varchar  - Sales territory"
        CONTACTLASTNAME: "varchar - Contact last name"
        CONTACTFIRSTNAME: "varchar - Contact first name"
        DEALSIZE:       "varchar  - Deal size category (Small/Medium/Large)"

